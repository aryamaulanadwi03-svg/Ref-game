const TUT={
g:['Geser jarimu ke atas, bawah, kiri, atau kanan. Semua angka ikut bergeser.','Dua angka yang sama akan menyatu dan nilainya berlipat dua.','Tips: simpan angka terbesar di satu sudut. Game berakhir saat papan penuh. Tombol ↶ membatalkan satu langkah (3 kali per game).'],
s:['Blok bergerak ke kiri dan kanan. Tap layar untuk menjatuhkannya.','Bagian yang menjuntai keluar dari blok bawah akan terpotong, jadi blok makin sempit.','Tap tepat di atas blok bawah untuk Sempurna. Sempurna beruntun melebarkan blok lagi.'],
d:['Karakter melompat otomatis. Geser jarimu ke kiri dan kanan untuk mengarahkannya naik ke platform.','Hindari duri merah, gergaji, dan UFO. Injak UFO atau gergaji dari atas untuk menghancurkannya. Jatuh ke bawah layar = game selesai.','Ambil koin beruntun untuk kombo hingga x4. Tap tombol ⚡ (atau tap layar) untuk dash kebal ke atas. 🛡️ perisai sekali pakai, 🧲 menarik koin. Platform oranye pecah, hijau melontarkan tinggi.'],
c:['Tap satu permata, lalu tap permata di sebelahnya untuk menukar.','Satukan 3 atau lebih yang sama. Rantai beruntun memberi kombo.','Kamu punya 25 langkah. Pakai sebaik mungkin untuk skor tertinggi.'],
i:['Kartu terbuka sebentar. Hafalkan posisi gambarnya, lalu kartu menutup.','Tap dua kartu untuk mencari pasangan. Cocok beruntun memberi kombo, dan cepat memberi bonus kecepatan.','Waktu habis atau salah pasang = kehilangan 1 ❤. Habis 3 ❤, game selesai.','Awas gambar yang mirip, dan di level tinggi kartu bisa diacak ulang.','Kartu spesial: 🃏 joker (pasangannya membuka intipan semua kartu), ⏳ tambah waktu, 💀 jebakan (jangan dibuka!). Tombol 👁️ mengintip semua kartu (1x). Level tanpa salah = PERFECT.'],
h:['Pilih jawaban yang benar secepat mungkin.','Benar menambah waktu, salah mengurangi 3 detik.','Tiap 3 benar beruntun, pengali naik sampai x4. Soal makin beragam di level tinggi.'],
w:['Susun huruf acak menjadi kata yang benar.','Tap huruf berurutan. Tap kotak jawaban untuk menghapus huruf terakhir.','Tiap kata punya waktu sendiri. Waktu habis = kehilangan 1 ❤. Salah susun tidak ada hukuman. Buntu? Pakai 💡 Petunjuk.']};
const TUT2={id:{c:['Tap tile yang tidak tertutup untuk memindahkannya ke baki.','Kumpulkan 3 buah sama di baki. Baki penuh atau waktu habis = game selesai. Baki makin kecil di level tinggi. Match beruntun memberi kombo besar.','❓ belum terlihat sampai tidak tertutup. ❄️ perlu ditap sekali untuk mencair. ⛓️ dua tile terikat: buka keduanya dulu sebelum bisa diambil.','💣 meledak setelah beberapa langkah dan mengurangi slot baki. Ambil tile 💣 dulu untuk menjinakkannya.','Power-up (1x tiap jenis): ↩️ undo, 🧲 melengkapi buah di baki, 🔀 acak. Selesaikan level tanpa power-up untuk PERFECT: bonus poin dan power-up gratis.'],w:['Geser jarimu menyambung huruf di roda untuk membentuk kata.','Kata yang cocok mengisi kotak. Kata lain yang valid memberi poin bonus.','Waktu terbatas, tiap kata menambah waktu. Tap 🔀 di tengah untuk mengacak, 💡 untuk petunjuk.'],b:['Seret blok dari bawah ke papan 8x8.','Baris atau kolom yang penuh akan hilang. Hapus beberapa sekaligus untuk poin besar.','Game selesai saat tidak ada blok yang muat.']},en:{c:['Tap an uncovered tile to move it into the tray.','Collect 3 identical fruits in the tray. Full tray or time out = game over. The tray shrinks at higher levels. Fast matches build big combos.','❓ tiles stay hidden until uncovered. ❄️ needs one tap to melt. ⛓️ two tied tiles: free both before you can take either.','💣 explodes after a few moves and removes a tray slot. Pick the 💣 tile first to defuse it.','Power-ups (1 of each): ↩️ undo, 🧲 completes the fruit in your tray, 🔀 shuffle. Clear a level with no power-ups for PERFECT: bonus points and a free power-up.'],w:['Swipe across the wheel letters to form words.','Matching words fill the grid. Other valid words give bonus points.','Time is limited; each word adds time. Tap 🔀 in the center to shuffle, 💡 for a hint.'],b:['Drag blocks from the bottom onto the 8x8 board.','Full rows or columns disappear. Clear several at once for big points.','Game over when no block fits.']}};Object.assign(TUT,TUT2.id);Object.assign(TUT2.en,{g:['Swipe up, down, left or right. All tiles slide with your finger.','Two equal numbers merge and their value doubles.','Tip: keep your biggest number in a corner. The game ends when the board is full. The ↶ button undoes one move (3 per game).'],s:['The block moves left and right. Tap the screen to drop it.','Any part overhanging the block below is cut off, so the tower gets narrower.','Tap exactly above the block below for a Perfect. Consecutive Perfects widen the block again.'],d:['Your character jumps automatically. Drag left and right to steer onto the platforms.','Avoid red spikes, saw blades and UFOs. Stomp UFOs or saws from above to destroy them. Falling off the bottom ends the game.','Chain coins for up to x4 combos. Tap the ⚡ button (or tap the screen) for an invincible upward dash. 🛡️ is a one-time shield, 🧲 pulls in coins. Orange platforms break, green ones launch you high.'],i:['Cards flash for a moment. Memorize where each picture is, then they flip back.','Tap two cards to find a pair. Streaks build combos and quick matches earn a speed bonus.','Running out of time or a wrong pair costs 1 ❤. Lose all 3 and the game is over.','Watch out for look-alike pictures, and at higher levels the cards get reshuffled.','Special cards: 🃏 joker (matching it peeks at all cards), ⏳ adds time, 💀 trap (do not flip it!). The 👁️ button peeks at all cards (once). A level with no mistakes is PERFECT.'],h:['Pick the correct answer as fast as you can.','A correct answer adds time; a wrong one costs 3 seconds.','Every 3 correct in a row raises the multiplier up to x4. Questions get more varied at higher levels.']});
