  const nt=(ty,f,t,d,g,at,f2)=>{const o=ac.createOscillator(),v=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,T+t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+t+d);v.gain.setValueAtTime(.0001,T+t);v.gain.exponentialRampToValueAtTime(g,T+t+at);v.gain.exponentialRampToValueAtTime(.0001,T+t+d);o.connect(v);v.connect(out);o.start(T+t);o.stop(T+t+d+.05)};

  const uid=cloud.u.uid,put=d=>{d.cu=uid;d.mode='google';localStorage.setItem('ref5',JSON.stringify(d))};
  if(D.cu&&D.cu!==uid){put(sn.exists?JSON.parse(sn.data().d):{});location.reload();return}
  if(sn.exists){const c=JSON.parse(sn.data().d),gb=o=>o.b||{},hs=(a,b)=>(a||[]).some(x=>!(b||[]).includes(x));
    const chg=(c.xp|0)>(D.xp|0)||Object.keys(gb(c)).some(k=>(gb(c)[k]||0)>(gb(D)[k]||0))||hs(c.own,D.own)||hs(c.ac,D.ac)||(c.pl|0)>(D.pl|0)||(c.mc|0)>(D.mc|0);
    if(chg){const r=JSON.parse(JSON.stringify((c.xp|0)>(D.xp|0)?c:D));r.b={};new Set([...Object.keys(gb(c)),...Object.keys(gb(D))]).forEach(k=>r.b[k]=Math.max(gb(c)[k]||0,gb(D)[k]||0));
      r.own=[...new Set([...(c.own||[0]),...(D.own||[0])])].sort((a,b)=>a-b);r.ac=[...new Set([...(c.ac||[]),...(D.ac||[])])];r.pl=Math.max(c.pl|0,D.pl|0);r.mc=Math.max(c.mc|0,D.mc|0);if(!r.own.includes(r.th))r.th=0;
      put(r);location.reload();return}}
  D.cu=uid;try{localStorage.setItem('ref5',JSON.stringify(D))}catch(e){}
  await r.set({d:JSON.stringify(D),t:Date.now()});
  GAMES.forEach(g=>D.b[g.k]>0&&cloud.db.doc('lb_'+g.k+'/'+cloud.u.uid).set({n:D.name||'Pemain',s:D.b[g.k],t:Date.now(),v:lvl().l,f:D.fr,a:D.ai}).catch(()=>{}));
  toast(T('☁ Tersambung','☁ Connected'));cloud.sd=1}catch(e){cloud.sd=1}}
function cloudInit(){if(!FBC)return;(async()=>{try{
  for(const n of['app','auth','firestore'])await new Promise((r,j)=>{const e=document.createElement('script');e.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-'+n+'-compat.js';e.onload=r;e.onerror=j;document.head.appendChild(e)});
  firebase.initializeApp(FBC);cloud.au=firebase.auth();cloud.db=firebase.firestore();
  cloud.au.onAuthStateChanged(u=>{cloud.u=u;if(u)cloudSync()})}catch(e){}})()}
cloudInit();
/* tombol Back */
let _bi=0,_ba=0;
const _bp=()=>{try{history.pushState({r:1},'')}catch(e){}};
addEventListener('pointerdown',()=>{if(!_bi){_bi=1;_bp()}},{once:true});
addEventListener('popstate',()=>{
  if(!_bi)return;
  if($('#load'))return _bp();
  const gm=!$('#game').classList.contains('hid');
  if(!$('#ov').classList.contains('hid')){
    if($('#nm')||$('#wg')){}
    else if(gm&&$('#ok')&&!$('#xx'))menu();
    else if($('#xx'))$('#xx').click();
    else if($('#rvn'))$('#rvn').click();
    else if($('#rs'))$('#rs').click();
    else if($('#mn'))$('#mn').click();
    else if($('#nn'))$('#nn').click();
    else if($('#ok'))$('#ok').click();
    else close();
    return _bp();
  }
  if(gm)quit();
  else if(!$('#lbs').classList.contains('hid'))menu();
  else{
    if(_ba){_ba=0;history.back();return}
    _ba=1;toast(T('Tekan Back sekali lagi untuk keluar','Press Back again to exit'));setTimeout(()=>_ba=0,2000);
  }
  _bp();
});
/* pasang aplikasi */
let _dip=null;
const _stand=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,_ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
function insUI(){$('#ins').classList.toggle('hid',_stand()||!(_dip||_ios))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();_dip=e;insUI()});
addEventListener('appinstalled',()=>{_dip=null;insUI();toast(T('Aplikasi terpasang','App installed'))});
$('#ins').onclick=async()=>{
  if(_dip){_dip.prompt();try{await _dip.userChoice}catch(e){}_dip=null;insUI();return}
  pop(`<h2 class="serif" style="font-size:26px">${T('Pasang REF','Install REF')}</h2><p>${T('Di iPhone/iPad: ketuk tombol Bagikan di Safari, lalu pilih "Tambah ke Layar Utama".','On iPhone/iPad: tap the Share button in Safari, then choose "Add to Home Screen".')}</p>`,close)};
insUI();
/* offline */
addEventListener('offline',()=>toast(T('Kamu offline. Game tetap bisa dimainkan','You are offline. Games still work')));
addEventListener('online',()=>{toast(T('Kembali online','Back online'));if(FBC&&!cloud.db)cloudInit()});
/* PWA */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)toast(T('Versi baru siap. Buka ulang aplikasi','New version ready. Reopen the app'))});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
/* loading */
const tips=[T('Menyiapkan papan...','Setting up the board...'),T('Menyusun tantangan...','Preparing challenges...'),T('Hampir siap...','Almost ready...')];let ti=0;
const tt=setInterval(()=>{$('#tip').textContent=tips[++ti%tips.length]},650);
setTimeout(()=>{clearInterval(tt);menu();const L=$('#load');L.style.opacity=0;setTimeout(()=>L.remove(),600);if(!D.mode&&D.name){D.mode='guest';save()}if(!D.mode)welcome();else if(!D.name)askName();else loginBonus();const m=/#c=(\w)\.([\d-]+)\.(\d+)/.exec(location.hash);if(m&&GAMES.some(g=>g.k===m[1])){try{history.replaceState(null,'',location.pathname)}catch(e){}play(m[1],{d:m[2],t:+m[3]})}},3000);
</script>
