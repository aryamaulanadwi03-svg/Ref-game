/* ===== TEMA TOKO (3 tema: galaxy, candy, wood) =====
   Tema aktif ditandai atribut data-th di <html>. Malam (bawaan) tidak punya atribut = tampilan lama. */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
html[data-th] #fx{display:block}
body:has(#game:not(.hid)) #fx{display:none}
#fx i,#fx b{position:absolute;display:block;font-style:normal}

/* ---- aturan bersama: bentuk kartu, tombol, huruf ---- */
html[data-th] body,html[data-th] :is(button,input,#nav button,.hm-coin,.hm-play,.bnr){font-family:var(--fb,Manrope,system-ui,sans-serif)}
html[data-th] .serif{font-family:var(--fd);font-style:var(--fs,italic);font-weight:var(--fw,600);letter-spacing:var(--fl,0)}
html[data-th] :is(.pf,.gc,.sci,.pc,.pop,.rkc,.shc,.mqi,#qa .qc,.hm-ban,#dm,.pn,.tti,.rkf,#lbn){border-radius:var(--rc)!important;box-shadow:var(--sh)!important;border-color:var(--ob)!important;border-width:var(--bw)!important}
html[data-th] .btn:not(.ib):not(.xx){border-radius:var(--rb)!important}
html[data-th] :is(.btn,.hm-play){border-width:var(--bw)}
html[data-th] .hm-ban{background:var(--bn)!important}
html[data-th] .hm-play{color:var(--bnt)!important}
html[data-th] :is(.lh,#ac2){background:var(--hd)!important}
html[data-th] .pc.hero::before{background:var(--hd)!important}
html[data-th] :is(.rkl,.sp,.lbchip){background:color-mix(in srgb,var(--gd) 18%,transparent)!important}
html[data-th] .lbt .rw{background:color-mix(in srgb,var(--gd) 12%,transparent)}
html[data-th] .lbt .rw.t1{background:color-mix(in srgb,var(--gd) 24%,transparent)}
html[data-th] :is(.pdm small,.lbt .rw b.rk){color:var(--gd)}
html[data-th] .pav{background:var(--gd)}
html[data-th] #nav{background:var(--sf);border-top:var(--bw) solid var(--ob)}
html[data-th] #nav button.on{color:var(--gd)!important;background:color-mix(in srgb,var(--gd) 18%,transparent)!important}

/* ================= 1. GALAKSI: bintang berkedip, bintang jatuh, planet bercincin, kaca buram ================= */
html[data-th=galaxy]{--fd:Georgia,'Noto Serif',serif;--fs:normal;--fw:700;--fl:.06em;--rc:22px;--rb:16px;--bw:1px;--ob:#4b58a8;--sh:0 8px 28px #0006,inset 0 1px 0 #ffffff14;--hd:linear-gradient(90deg,#7c6cff,#c06cff);--bn:linear-gradient(135deg,#4a2cc9,#8a4bff 55%,#ff7ad9);--bnt:#5a2bd0}
html[data-th=galaxy] .serif{text-shadow:0 0 18px #9d8cffaa}
html[data-th=galaxy] :is(.pf,.sci,.pc,.rkc,.shc,.mqi,#qa .qc){backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
html[data-th=galaxy] #fx{background:radial-gradient(60% 40% at 15% 20%,#6a3cff44,transparent 70%),radial-gradient(55% 40% at 90% 70%,#ff4fc333,transparent 70%),radial-gradient(70% 50% at 50% 110%,#2b6bff33,transparent 70%)}
html[data-th=galaxy] #fx .a,html[data-th=galaxy] #fx .b{inset:0;background-repeat:repeat}
html[data-th=galaxy] #fx .a{background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 70px,#cfd8ff,transparent),radial-gradient(2px 2px at 150px 20px,#fff,transparent),radial-gradient(1px 1px at 60px 130px,#fff,transparent),radial-gradient(1.5px 1.5px at 180px 150px,#ffd9f6,transparent);background-size:200px 180px;animation:twk 3.4s ease-in-out infinite alternate}
html[data-th=galaxy] #fx .b{background-image:radial-gradient(1px 1px at 40px 50px,#fff,transparent),radial-gradient(2px 2px at 120px 110px,#bcd0ff,transparent),radial-gradient(1px 1px at 170px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 10px 150px,#fff,transparent);background-size:230px 200px;animation:twk 2.3s ease-in-out -1s infinite alternate}

i:['Kartu terbuka sebentar. Hafalkan posisi gambarnya, lalu kartu menutup.','Tap dua kartu untuk mencari pasangan. Cocok beruntun memberi kombo, dan cepat memberi bonus kecepatan.','Waktu habis atau salah pasang = kehilangan 1 ❤. Habis 3 ❤, game selesai.','Awas gambar yang mirip, dan di level tinggi kartu bisa diacak ulang.','Kartu spesial: 🃏 joker (pasangannya membuka intipan semua kartu), ⏳ tambah waktu, 💀 jebakan (jangan dibuka!). Tombol 👁️ mengintip semua kartu (1x). Level tanpa salah = PERFECT.'],
h:['Pilih jawaban yang benar secepat mungkin.','Benar menambah waktu, salah mengurangi 3 detik.','Tiap 3 benar beruntun, pengali naik sampai x4. Soal makin beragam di level tinggi.'],
w:['Susun huruf acak menjadi kata yang benar.','Tap huruf berurutan. Tap kotak jawaban untuk menghapus huruf terakhir.','Tiap kata punya waktu sendiri. Waktu habis = kehilangan 1 ❤. Salah susun tidak ada hukuman. Buntu? Pakai 💡 Petunjuk.']};

↶ button undoes one move (3 per game).'],s:['The block moves left and right. Tap the screen to drop it.','Any part overhanging the block below is cut off, so the tower gets narrower.','Tap exactly above the block below for a Perfect. Consecutive Perfects widen the block again.'],d:['Your character jumps automatically. Drag left and right to steer onto the platforms.','Avoid red spikes, saw blades and UFOs. Stomp UFOs or saws from above to destroy them. Falling off the bottom ends the game.','Chain coins for up to x4 combos. Tap the ⚡ button (or tap the screen) for an invincible upward dash. 🛡️ is a one-time shield, 🧲 pulls in coins. Orange platforms break, green ones launch you high.'],i:['Cards flash for a moment. Memorize where each picture is, then they flip back.','Tap two cards to find a pair. Streaks build combos and quick matches earn a speed bonus.','Running out of time or a wrong pair costs 1 ❤. Lose all 3 and the game is over.','Watch out for look-alike pictures, and at higher levels the cards get reshuffled.','Special cards: 🃏 joker (matching it peeks at all cards), ⏳ adds time, 💀 trap (do not flip it!). The 👁️ button peeks at all cards (once). A level with no mistakes is PERFECT.'],h:['Pick the correct answer as fast as you can.','A correct answer adds time; a wrong one costs 3 seconds.','Every 3 correct in a row raises the multiplier up to x4. Questions get more varied at higher levels.']});

const SDP=(()=>{const P=[];for(let i=0;i<81;i++){const r=i/9|0,c=i%9,s=new Set();for(let k=0;k<9;k++){s.add(r*9+k);s.add(k*9+c)}for(let a=0;a<3;a++)for(let b=0;b<3;b++)s.add((r-r%3+a)*9+c-c%3+b);s.delete(i);P.push([...s])}return P})();

const sdPc=m=>{let c=0;while(m){m&=m-1;c++}return c};

    if(!bc)return;

/* semua langkah "angka tunggal" yang tersedia sekarang: naked single & hidden single */

/* true jika bisa selesai hanya dengan angka tunggal (tanpa menebak) */
function sdLogic(g){
  const a=Int8Array.from(g);
  for(;;){
    let left=0;for(let i=0;i<81;i++)if(!a[i])left++;
    if(!left)return true;
    const s=sdSingles(a);if(!s.length)return false;
