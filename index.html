}

/* GAME 2: menara */
function startS(){
  const id=run,W=Math.floor(Math.min(innerWidth*.92,420)),H=Math.floor(Math.min(innerHeight*.7,600)),bh=26,[cv,x]=mkCv(W,H),al=()=>run===id;
  let st=[{x:W*.25,w:W*.5}],cur=null,score=0,cam=0,state=0,pcs=[],streak=0,msg='',mt=0;
  const spawn=()=>{const t=st[st.length-1],l=st.length%2;cur={x:l?-t.w:W,w:t.w,d:l?1:-1}};
  const ly=i=>H-48-i*bh+cam,hue=i=>`hsl(${(210+i*8)%360} 52% 62%)`;
  cv.onpointerdown=()=>{
    if(state===0){state=1;spawn();return}
    if(state!==1)return;
    const t=st[st.length-1],ov=Math.min(cur.x+cur.w,t.x+t.w)-Math.max(cur.x,t.x);
    if(ov<=0){state=2;pcs.push({x:cur.x,w:cur.w,i:st.length,y:0,v:0});vib(80);sk(cv);beep(150,.3);setTimeout(()=>al()&&finish('s',score),900);return}
    if(Math.abs(cur.x-t.x)<5){cur.x=t.x;cur.w=t.w;streak++;vib(15);msg=streak>1?'Sempurna x'+streak:'Sempurna';mt=40;beep(P[Math.min(streak+1,7)],.15);
      if(streak>=3){cur.w=Math.min(W*.5,cur.w+8);cur.x-=4}}
    else{streak=0;const a=cur.x<t.x?[cur.x,t.x-cur.x]:[t.x+t.w,cur.x+cur.w-t.x-t.w];pcs.push({x:a[0],w:a[1],i:st.length,y:0,v:0});cur.x=Math.max(cur.x,t.x);cur.w=ov;beep(330,.08)}
    st.push({x:cur.x,w:cur.w});score++;$('#gi').textContent=score;chk(score);spawn();
  };
  function tick(){
    if(!al())return;x.clearRect(0,0,W,H);
    cam+=(Math.max(0,st.length-8)*bh-cam)*.12;
    if(state===1){cur.x+=cur.d*Math.min(7,2.6+score*.07);if(cur.x<0){cur.x=0;cur.d=1}if(cur.x+cur.w>W){cur.x=W-cur.w;cur.d=-1}}
    st.forEach((b,i)=>{x.fillStyle=hue(i);x.fillRect(b.x,ly(i),b.w,bh-2)});
    if(state===1){x.fillStyle=hue(st.length);x.fillRect(cur.x,ly(st.length),cur.w,bh-2)}
    pcs=pcs.filter(p=>p.y<H);pcs.forEach(p=>{p.v+=.6;p.y+=p.v;x.globalAlpha=.8;x.fillStyle=hue(p.i);x.fillRect(p.x,ly(p.i)+p.y,p.w,bh-2);x.globalAlpha=1});
    x.textAlign='center';
    if(mt>0){mt--;x.globalAlpha=mt/40;x.fillStyle='#d8b873';x.font='700 22px Manrope,sans-serif';x.fillText(msg,W/2,70);x.globalAlpha=1}
    if(state===0){x.fillStyle='#8d95ad';x.font='600 15px Manrope,sans-serif';x.fillText('Tap untuk menjatuhkan blok',W/2,H/2-60)}
    raf60(tick);
  }
  tick();
}

/* GAME 3: lincah */
function startD(){
  const id=run,W=Math.floor(Math.min(innerWidth*.92,420)),H=Math.floor(Math.min(innerHeight*.7,600)),[cv,x]=mkCv(W,H),al=()=>run===id;
  let px=W/2,tx=W/2,t=0,gems=0,state=0,ob=[],it=[],slow=0,wc=0,nt=40,tr=[],sh=0;
  const R=13,py=H-64,sc=()=>Math.floor(t/60)+gems*5;
  const mvp=e=>{const b=cv.getBoundingClientRect();tx=Math.max(R,Math.min(W-R,e.clientX-b.left))};
  cv.onpointerdown=e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}mvp(e);if(!state)state=1};
  cv.onpointermove=mvp;
  function spawn(){
    const v=Math.min(8,2.4+t/800+Math.random()*1.2);wc++;
    if(wc%9===0){const g=Math.max(70,120-t/60),gx=Math.random()*(W-g);ob.push({x:0,y:-20,w:gx,h:18,v},{x:gx+g,y:-20,w:W-gx-g,h:18,v})}
    else{const w=24+Math.random()*50;ob.push({x:Math.random()*(W-w),y:-40,w,h:22+Math.random()*16,v})}
    if(Math.random()<.22)it.push({x:20+Math.random()*(W-40),y:-30,v:v*.8,k:(r=>r<.2?1:r<.35?2:0)(Math.random())});
  }
  function tick(){
    if(!al())return;x.clearRect(0,0,W,H);
    if(state===1){
      t++;px+=(tx-px)*.3;const f=slow>0?.5:1;if(slow>0)slow--;
      if(--nt<=0){spawn();nt=Math.max(16,46-t/90)}
      ob.forEach(o=>o.y+=o.v*f);it.forEach(o=>o.y+=o.v*f);
      for(const o of ob){const cx=Math.max(o.x,Math.min(px,o.x+o.w)),cy=Math.max(o.y,Math.min(py,o.y+o.h));
        if((px-cx)**2+(py-cy)**2<(R-3)**2){if(sh){sh=0;ob.splice(ob.indexOf(o),1);beep(300,.15);vib(30);sk(cv);break}state=2;vib(80);sk(cv);beep(150,.3);setTimeout(()=>al()&&finish('d',sc()),700);break}}
      it=it.filter(o=>{if((px-o.x)**2+(py-o.y)**2<(R+11)**2){if(o.k===1){slow=240;beep(500,.2)}else if(o.k===2){sh=1;beep(700,.15);vib(15)}else{gems++;vib(8);beep(P[gems%8],.1)}return false}return o.y<H+30});
      ob=ob.filter(o=>o.y<H+50);
      tr.push(px);if(tr.length>8)tr.shift();
      $('#gi').textContent=sc();chk(sc());
    }
    ob.forEach(o=>{x.fillStyle='#e0556b';x.beginPath();x.roundRect?x.roundRect(o.x,o.y,o.w,o.h,6):x.rect(o.x,o.y,o.w,o.h);x.fill()});
    it.forEach(o=>{x.beginPath();if(o.k){x.arc(o.x,o.y,10,0,6.283);x.fillStyle=o.k===2?'#69db7c':'#5b9cf0'}else{x.moveTo(o.x,o.y-12);x.lineTo(o.x+9,o.y);x.lineTo(o.x,o.y+12);x.lineTo(o.x-9,o.y);x.closePath();x.fillStyle='#f0b34a'}x.fill()});
    tr.forEach((p,i)=>{x.globalAlpha=i/20;x.beginPath();x.arc(p,py+(8-i)*3,R*.7,0,6.283);x.fillStyle='#ece8e0';x.fill()});x.globalAlpha=1;
    if(state<2){x.beginPath();x.arc(px,py,R,0,6.283);x.fillStyle='#ece8e0';x.fill();
      if(slow>0){x.beginPath();x.arc(px,py,R+6,0,6.283);x.strokeStyle='#5b9cf0';x.lineWidth=2;x.stroke()}if(sh){x.beginPath();x.arc(px,py,R+10,0,6.283);x.strokeStyle='#69db7c';x.lineWidth=3;x.stroke()}}
    if(state===0){x.fillStyle='#8d95ad';x.font='600 15px Manrope,sans-serif';x.textAlign='center';x.fillText('Tap lalu geser untuk bergerak',W/2,H/2)}
    raf60(tick);
  }
  tick();
}

/* loading */
const tips=['Menyiapkan papan...','Menyusun tantangan...','Hampir siap...'];let ti=0;
const tt=setInterval(()=>{$('#tip').textContent=tips[++ti%tips.length]},650);
setTimeout(()=>{clearInterval(tt);menu();const L=$('#load');L.style.opacity=0;setTimeout(()=>L.remove(),600);if(!D.name)askName();else loginBonus()},2200);
</script>
