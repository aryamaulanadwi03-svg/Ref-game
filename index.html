<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>REF</title><meta name="theme-color" content="#0d1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="REF"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/manrope-700.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/cormorant-600-italic.woff2" as="font" type="font/woff2" crossorigin>
<!-- ============================================================
     DAFTAR ISI  (cari pakai Ctrl+F, ketik "/ " lalu nama bagian)
     1. CSS    : fonts, base, tombol, layout, popup, profil, beranda, tema, game
     2. HTML   : layar menu, profil, ranking, toko, papan skor, game, popup
     3. JS     : data, save/load, UI, misi, tema, toko, profil, engine, 8 game, cloud, PWA
     4. KAMUS  : daftar kata game Words (script terpisah di paling bawah)
     ============================================================ -->
<style>
/* ============================================================
   CSS 1 / FONTS
   Path fonts/... harus ada di folder. Untuk benar-benar 1 file, embed woff2 sebagai base64.
   ============================================================ */
@font-face{font-family:Manrope;font-weight:500;font-style:normal;font-display:swap;src:url(fonts/manrope-500.woff2) format('woff2')}
@font-face{font-family:Manrope;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/manrope-700.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-weight:600;font-style:italic;font-display:swap;src:url(fonts/cormorant-600-italic.woff2) format('woff2')}
/* ============================================================
   CSS 2 / BASE: variabel warna, reset, utilitas
   ============================================================ */
:root{--bg:#0d1220;--sf:#161d31;--ln:#2b3555;--tx:#ece8e0;--mu:#8d95ad;--gd:#d8b873}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--tx);font:500 15px Manrope,system-ui,sans-serif;touch-action:manipulation;background:radial-gradient(120% 60% at 50% -10%,var(--hl,#1f2a4d),var(--bg) 62%) var(--bg)}
h1,h2,p{margin:0}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600}
.scr{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:absolute;inset:0;padding:max(env(safe-area-inset-top),16px) 18px max(env(safe-area-inset-bottom),16px);display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto}
.hid{display:none!important}
/* ============================================================
   CSS 3 / TOMBOL
   ============================================================ */
.btn{font:inherit;font-weight:700;color:var(--tx);background:transparent;border:1px solid var(--ln);border-radius:14px;padding:11px 18px;cursor:pointer}
.btn:active{background:var(--sf)}
.pri{background:var(--gd);color:#1b1608;border-color:var(--gd)}.pri:active{background:#c9a862}
/* ============================================================
   CSS 4 / LOADING SCREEN
   ============================================================ */
#load{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#load h1{font-size:76px;letter-spacing:.14em;animation:fi 1s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.lb{width:150px;height:2px;background:var(--ln);overflow:hidden}.lb i{display:block;height:100%;width:0;background:var(--gd);animation:ld 3s ease-in-out forwards}
@keyframes ld{to{width:100%}}
#tip{font-size:13px;color:var(--mu);height:18px}
/* ============================================================
   CSS 5 / LAYOUT UMUM, KARTU GAME, HEADER GAME
   ============================================================ */
.sub{color:var(--mu);font-size:13px;text-align:center}
.top{width:min(100%,420px);display:flex;justify-content:space-between;align-items:center}
.pf,.gc{width:min(100%,420px);display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--ln);cursor:pointer}
.gc:active{border-color:var(--gd)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gd);color:#1b1608;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center}
.ic{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--gd);color:var(--gd);display:flex;align-items:center;justify-content:center;font-size:21px}
.tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.tx b{font-size:16px}.tx small{color:var(--mu);font-size:12px}
.pb{display:block;height:3px;background:var(--ln);border-radius:3px;margin-top:6px;overflow:hidden}.pb u{display:block;height:100%;background:var(--gd)}
.sr{color:var(--gd);font-weight:700;font-size:13px;text-align:right;line-height:1.35}.sr small{color:var(--mu);font-weight:500;display:block;font-size:12px}
.q{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:none;color:var(--mu);font:inherit;font-weight:700}
.rw2{display:flex;gap:10px}
.hd{width:min(100%,460px);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hd .btn{padding:7px 14px}.hd b{font-size:15px;color:var(--mu)}
.chip{font-weight:700;font-size:26px;color:var(--gd);min-width:56px;text-align:right}
#gs{font-size:13px;color:var(--mu);min-height:18px;text-align:center}
/* ============================================================
   CSS 6 / PAPAN & TILE (dipakai Gabung/Merge)
   ============================================================ */
.bd{border:1px solid var(--ln);border-radius:18px;background:var(--sf);touch-action:none}
.b2{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:18px;touch-action:none}
.cl,.tl{position:absolute;border-radius:12px}
.cl{background:#0d122099}
.tl{z-index:2;display:flex;align-items:center;justify-content:center;font-weight:700;transition:left .13s cubic-bezier(.25,.8,.3,1),top .13s cubic-bezier(.25,.8,.3,1)}
.pp{animation:pp2 .16s}@keyframes pp2{50%{transform:scale(1.08)}}
.nw{animation:nw .18s}@keyframes nw{from{opacity:0;transform:scale(.85)}}
/* ============================================================
   CSS 7 / POPUP, TOAST & PAPAN SKOR DASAR
   ============================================================ */
#ov{position:fixed;inset:0;z-index:5;background:#070a14cc;display:flex;align-items:center;justify-content:center;padding:20px}
.pop{background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:22px 20px;width:min(100%,340px);max-height:92vh;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:9px;animation:pp .3s;text-align:center}
@keyframes pp{from{transform:translateY(12px);opacity:0}}
.pop .btn{width:100%}.pop p{color:var(--mu);line-height:1.45}
.pop input{width:100%;font:inherit;font-size:17px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;text-align:center;user-select:text;-webkit-user-select:text}
.gl{display:flex;gap:14px;font-weight:700;font-size:14px;margin:2px 0 6px}
.xp{color:var(--gd);font-weight:700}
.tabs{display:flex;gap:8px}.tb{padding:8px 14px;font-size:14px}.tb.on{border-color:var(--gd);color:var(--gd)}
#ll{width:min(100%,420px);display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
.rw b{width:22px;color:var(--gd)}.rw span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rw em{font-style:normal;font-weight:700}.rw small{color:var(--mu);width:46px;text-align:right}
#t{position:fixed;left:50%;top:13%;transform:translateX(-50%);background:var(--gd);color:#1b1608;border-radius:12px;padding:6px 16px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:8;white-space:nowrap}
#t.on{opacity:1}
.pw{position:relative;width:min(100%,340px)}.pw .pop{width:100%}.pop.hx{padding-top:48px}
.xx{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--mu);font-size:14px;line-height:1;cursor:pointer}
.xx:active{background:var(--ln)}
/* ============================================================
   CSS 8 / PROFIL, AVATAR & BINGKAI
   ============================================================ */
.a2 svg.fr{inset:-10%;width:120%;height:120%;overflow:visible}
.pc{width:100%;padding:14px;border:1px solid var(--ln);border-radius:18px;background:linear-gradient(180deg,var(--sf),var(--bg));display:flex;flex-direction:column;gap:12px;text-align:left}
.pc .ph .tx b{font-size:20px}.chp{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;color:var(--gd);border:1px solid var(--gd);border-radius:999px;padding:2px 10px;margin-top:5px}
.xr{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.xr b{color:var(--tx);font-size:14px}
.xb{height:10px;border-radius:6px;background:#0006;border:1px solid var(--ln);overflow:hidden;margin:6px 0 0}.xb i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--gd),#fff3c4)}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sg div{border:1px solid var(--ln);border-radius:12px;padding:8px 4px;text-align:center;background:var(--bg)}.sg b{display:block;font-size:16px}.sg small{font-size:11px;color:var(--mu)}
.seg{display:flex;width:100%;border:1px solid var(--ln);border-radius:12px;padding:3px;gap:3px;background:var(--bg)}
.seg button{flex:1;border:0;border-radius:9px;padding:8px;background:transparent;color:var(--mu);font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--gd);color:#1b1608}
.pn{width:100%;border:1px solid var(--ln);border-radius:16px;padding:12px 8px;background:var(--bg)}
.pop .ao,.pop .fc{border:1px solid var(--ln);background:var(--sf);border-radius:14px;padding:8px 4px;position:relative;transition:transform .1s}
.pop .ao:active,.pop .fc:active{transform:scale(.96)}
.pn .ao.on,.pn .fc.on{border-color:var(--gd);box-shadow:0 0 0 1px var(--gd)}
.pn .ao.on::after,.pn .fc.on::after{content:'✓';position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--gd);color:#1b1608;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pn .fc span{font-size:12px;color:var(--tx);font-weight:700}.pn .fc small{font-size:10px;color:var(--mu)}
.a2{position:relative;display:inline-block;flex:none;width:var(--s);height:var(--s)}
.a2 .ai{position:absolute;inset:14%;border-radius:50%;overflow:hidden}
.a2 svg{display:block;width:100%;height:100%}.a2 .fr{position:absolute;inset:0;pointer-events:none}
.ao{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;border:2px solid transparent;border-radius:14px;cursor:pointer}
.ao.on{border-color:var(--gd)}.ao.lk{opacity:.4}.ao small{font-size:10px;color:var(--mu)}
.ap{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;display:block}.ap svg{display:block;width:100%;height:100%}
.tr{position:relative;width:min(100%,420px);text-align:center}
.tr #co{position:absolute;right:0;top:50%;transform:translateY(-50%);padding:6px 12px;font-size:13px}
#tabs{flex-wrap:wrap;justify-content:center}
/* ============================================================
   CSS 9 / GAME: PAD, MATH (Hitung) & BLOCK BLAST
   ============================================================ */
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(86vw,360px);aspect-ratio:1;margin-top:16px}
.pad{border:0;border-radius:24px;opacity:.4;transition:opacity .1s,transform .1s}.pad.lit{opacity:1;transform:scale(1.05)}
.mq{width:min(92vw,380px);display:flex;flex-direction:column;gap:20px;margin-top:20px}
.tm{height:10px;border-radius:9px;background:#0004;overflow:hidden}.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff7a90,#ffd36e)}
.eq{font-size:48px;font-weight:800;text-align:center;padding:24px 0}.ch{display:grid;grid-template-columns:1fr 1fr;gap:12px}.an{font-size:26px;padding:20px 0}
/* Game Hitung: gaya sendiri, warna kalem supaya nyaman dan fokus */
.hq{width:min(100%,420px);margin-top:4px;display:flex;flex-direction:column;gap:18px}
.hq .hqr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.hq .hqb{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-radius:18px;background:#141b30;border:1px solid #232c4a}
.hq .hqb:last-child{align-items:flex-end}
.hq .hqb small{font-size:10px;font-weight:800;letter-spacing:.14em;color:#7d86a0}
.hq .hqb b{font-size:22px;font-weight:800;color:#cdb98a;line-height:1.1}
.hq .hqt{position:relative;width:66px;height:66px;display:flex;align-items:center;justify-content:center}
.hq .hqt svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hq .hqt circle{fill:none;stroke-width:5}.hq .hqt .bg{stroke:#232c4a}
.hq .hqt .fg{stroke:#b9a679;stroke-linecap:round;stroke-dasharray:163.4;stroke-dashoffset:0;transition:stroke-dashoffset .1s linear,stroke .3s}
.hq .hqt b{position:relative;font-size:20px;font-weight:800;color:#dcd8cf}
.hq .hqt.lo .fg{stroke:#d97a86}.hq .hqt.lo b{color:#d97a86}
.hq .hqe{padding:42px 8px;border-radius:24px;text-align:center;font-weight:800;font-size:42px;color:#e6e2d9;white-space:nowrap;overflow:hidden;background:#182039;border:1px solid #2a3454}
.hq .qm{color:#cdb98a}
.hq .hqg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hq .hqa{font:inherit;font-weight:700;font-size:30px;color:#dcd8cf;background:#212a47;border:1px solid #323d63;border-radius:20px;padding:0;height:80px;cursor:pointer;box-shadow:0 4px 0 #151c33;transition:transform .1s,background .2s,border-color .2s,box-shadow .1s}
.hq .hqa:active{transform:translateY(3px);box-shadow:0 1px 0 #151c33}
.hq .hqa.ko{background:#4a2a38;border-color:#c46b7b;color:#f0d4da;animation:ibad .35s}
.hq .hqa.okk{background:#244a3c;border-color:#5fae8a;color:#d6f0e2;animation:pp2 .25s}
#bx{display:grid;background:var(--sf);border-radius:18px;padding:4px;margin-top:16px}
.ce{display:flex;align-items:center;justify-content:center;border-radius:10px}
.ce b{width:76%;height:76%;border-radius:50%;box-shadow:inset 0 -3px 0 #0003;transition:transform .15s}
.ce.on{background:#ffffff25}.ce.on b{transform:scale(1.12)}.ce.bm b{transform:scale(0);transition:transform .25s}
.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
/* ============================================================
   CSS 10 / MISI HARIAN
   ============================================================ */
#dm{width:min(100%,420px);display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:var(--sf);border:1px solid var(--ln);margin-bottom:8px}
.ms{display:flex;align-items:center;gap:10px}.ms .tx b{font-size:14px}.ms small{color:var(--mu);font-size:12px;width:52px;text-align:right}
.cd{width:62px;text-align:center;color:var(--gd);font-weight:700}.rw3{width:62px;text-align:center;color:var(--mu);font-size:12px}
.cl2{padding:6px 8px;font-size:12px;width:62px}
.soon{opacity:.4;cursor:default}
/* ============================================================
   CSS 11 / BERANDA: BAR ATAS, DAFTAR GAME, IKON
   ============================================================ */
.bar2{width:min(100%,420px);display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar2 .pf{width:auto;flex:1;max-width:230px;padding:6px 12px 6px 6px;border-radius:999px;gap:8px}
.bar2 .tx b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar2 .tx small{font-size:11px}
.bar2 .pb{margin-top:3px}
.ibs{display:flex;gap:8px}.ib{width:42px;height:42px;padding:0;font-size:18px;border-radius:14px}
#gl{width:min(100%,420px);display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gt{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px 12px;border-radius:20px;background:var(--sf);border:1px solid var(--ln);cursor:pointer;text-align:center}
.gt:active{border-color:var(--gd)}.gt b{font-size:16px}.gt .mt{font-size:12px;color:var(--gd)}.gt small{font-size:12px;color:var(--mu)}
.gt .q{position:absolute;top:8px;right:8px;width:24px;height:24px;font-size:12px}
.lg{width:72px;height:72px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}.lg svg{width:100%;height:100%}
.lf{width:64px;height:64px;border-radius:18px;border:1px solid var(--gd);color:var(--gd);display:flex;align-items:center;justify-content:center;font-size:28px}
.hl{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin-right:6px}.hl svg{width:100%;height:100%}
/* ============================================================
   CSS 12 / ANIMASI IKON SVG GAME
   ============================================================ */
svg *{transform-box:fill-box;transform-origin:center}
.bn{animation:bn 1.8s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-3px)}}
.d1{animation-delay:.25s}.d2{animation-delay:.5s}.d3{animation-delay:.75s}
.sl{animation:sl 1.6s ease-in-out infinite alternate}@keyframes sl{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fl{animation:fl 1.8s linear infinite}@keyframes fl{0%{transform:translateY(-4px);opacity:0}15%,85%{opacity:1}100%{transform:translateY(32px);opacity:0}}
.sw2{animation:sw2 1.8s ease-in-out infinite alternate}@keyframes sw2{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}
/* ============================================================
   CSS 13 / PENGATURAN, TOGGLE, FRAME, GRID PROFIL
   ============================================================ */
.sl2{display:flex;justify-content:space-between;align-items:center;width:100%;padding:4px 2px;text-align:left}
.tg{flex:none;width:46px;height:26px;border-radius:13px;border:1px solid var(--ln);background:var(--bg);position:relative;padding:0;cursor:pointer}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mu);transition:left .15s}
.tg.on{background:var(--gd);border-color:var(--gd)}.tg.on::after{left:23px;background:#1b1608}
.fm{flex:none;display:inline-flex;width:var(--s);height:var(--s);padding:3px;border-radius:50%}
.fm .in{flex:1;border-radius:50%;background:var(--gd);color:#1b1608;font-weight:700;font-size:calc(var(--s)*.42);display:flex;align-items:center;justify-content:center}
.ph{display:flex;align-items:center;gap:14px;width:100%}.ph .tx{text-align:left}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}.gr .in{background:var(--bg)}
.fc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;font-size:11px;color:var(--mu);border:1px solid transparent;border-radius:12px;cursor:pointer}
.fc.on{border-color:var(--gd);color:var(--gd)}.fc.lk{opacity:.4}
.sr svg{display:block;margin-left:auto}
/* ============================================================
   CSS 14 / GAME: MEMORY (kartu balik) & ANIMASI SHAKE
   ============================================================ */
.sk{animation:sk .28s}@keyframes sk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.kg{display:grid;gap:8px;margin-top:8px}
.kc{perspective:600px;border:0;padding:0;background:none;cursor:pointer}
.kc i{display:block;width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s}
.kc.up i{transform:rotateY(180deg)}
.kc b,.kc u{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-decoration:none}
.kc b{background:repeating-linear-gradient(45deg,var(--sf),var(--sf) 6px,var(--bg) 6px,var(--bg) 12px);border:2px solid var(--gd);color:var(--gd);font-size:20px;font-weight:400}
.kc u{transform:rotateY(180deg);background:#f6efe0;border:2px solid #fff}
.kc.ok u{background:#d4f2c9;border-color:#69db7c}
.kc.ok{animation:pp2 .3s}
/* ============================================================
   CSS 15 / GAME: BLOCK BLAST (tambahan)
   ============================================================ */
.ce,.ce b{position:relative}.ce b::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 28%,#ffffffaa,#fff0 55%)}

/* ============================================================
   CSS 16 / OVERRIDE: BERANDA, BANNER, PAPAN SKOR
   ============================================================ */
#gl{grid-template-columns:repeat(3,1fr)!important;gap:10px!important}
#bn{width:min(100%,420px);display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bnr{border:0;border-radius:18px;padding:16px 10px;color:#fff;font:inherit;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:0 4px 12px #0003;text-shadow:0 1px 2px #0004}.bnr span{font-size:26px}.bnr:active{transform:scale(.97)}
#qa{width:min(100%,420px);display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
